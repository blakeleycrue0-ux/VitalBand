<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order confirmed — VitalBand</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <span></span>
      <a href="/" class="nav-logo">VITALBAND</a>
      <span></span>
    </div>
  </header>

  <main id="main-content">
    <div class="container page-simple">
      <div class="page-simple-inner">
        <span class="eyebrow" id="status-eyebrow">Payment received</span>
        <h1 id="status-heading">Thank you — your order is confirmed.</h1>
        <p class="lead" id="status-lead">We're finalizing your order details now. This usually takes just a few seconds.</p>

        <div class="order-status-card" id="order-card" hidden>
          <div class="order-status-head">
            <div>
              <div class="order-status-number">Order <strong id="order-number">—</strong></div>
            </div>
            <span class="status-pill" id="order-status-pill">Processing</span>
          </div>
        </div>

        <div id="success-error"></div>

        <a href="/track.html" class="btn btn-secondary" style="margin-top:32px;">Track your order</a>
        <a href="/" class="btn btn-primary" style="margin-top:32px;margin-left:12px;">Continue shopping</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>&copy; 2026 VitalBand. All rights reserved.</span>
      <span>Payments secured by Stripe.</span>
    </div>
  </footer>

  <script type="module" src="/src/js/success.js"></script>
</body>
</html>
