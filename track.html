<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track your order — VitalBand</title>
  <meta name="description" content="Check the status of your VitalBand order — payment, fulfillment and shipping." />
  <!-- Canonical URL is set client-side (see track.js) to avoid Vite treating
       a relative link[href] to another page as a build asset. -->
  <link rel="canonical" id="canonical-link" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <span></span>
      <a href="/" class="nav-logo">VITALBAND</a>
      <a href="/" class="icon-btn" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      </a>
    </div>
  </header>

  <main id="main-content">
    <div class="container page-simple" style="align-items:flex-start;">
      <div class="page-simple-inner" style="max-width:560px;">
        <span class="eyebrow">Order tracking</span>
        <h1>Track your order.</h1>
        <p class="lead">Enter your order number and the email used at checkout.</p>

        <form class="track-form" id="track-form" novalidate>
          <div>
            <label class="field-label" for="order-number-input">Order number</label>
            <input class="field-input" id="order-number-input" name="orderNumber" type="text" placeholder="VB-100234" required autocomplete="off" />
          </div>
          <div>
            <label class="field-label" for="email-input">Email</label>
            <input class="field-input" id="email-input" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <button type="submit" class="btn btn-primary" id="track-submit">Track order</button>
        </form>

        <div id="track-error"></div>

        <div class="order-status-card" id="order-result" hidden>
          <div class="order-status-head">
            <div>
              <div class="order-status-number">Order <strong id="result-order-number"></strong></div>
            </div>
            <span class="status-pill" id="result-status-pill"></span>
          </div>

          <div class="status-track" id="status-track"></div>

          <div class="tracking-detail" id="tracking-detail" hidden>
            <div><strong>Carrier:</strong> <span id="result-carrier"></span></div>
            <div><strong>Tracking number:</strong> <span id="result-tracking-number"></span></div>
            <div id="result-tracking-link-wrap"><a id="result-tracking-link" href="#" target="_blank" rel="noopener">View carrier tracking</a></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>&copy; 2026 VitalBand. All rights reserved.</span>
    </div>
  </footer>

  <script type="module" src="/src/js/track.js"></script>
</body>
</html>
